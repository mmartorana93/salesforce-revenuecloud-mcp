[metadata]
name = revenuecloud-mcp
version = 0.1.0
description = MCP server for Salesforce Revenue Cloud standard actions and REST APIs
long_description = file: README.md
long_description_content_type = text/markdown
author = Revenue Cloud MCP contributors
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only

[options]
packages = find:
python_requires = >=3.9
install_requires =

[options.packages.find]
include = revenuecloud_mcp*

[options.entry_points]
console_scripts =
    revenuecloud-mcp = revenuecloud_mcp.server:main
